# Claw ring — the ring-slot finger of the 4-finger hand (claw4f). Same printed regular finger
# as claw_finger/claw_mid; its own bundle so it carries a role label ("Claw ring") instead of
# showing "Claw index" on the ring socket. Geometry byte-identical to claw_finger; the ring's
# real placement comes from the palm4 ring PORT frame (a rough twin stand-in).
name: claw_ring
label: "Claw ring"
motors: 3
slot: finger                 # fits the palm4 ring slot (accepts: finger)

dofs:
  - { key: spread, label: "Spread", joint: "palm_Umdrehung-23", range: [-0.139626, 1.047198] }
  - { key: flex,   label: "Flex",   joint: "mcp_yoke_index_Umdrehung-24", range: [-1.221730, 2.094395] }
  - { key: curl,   label: "Curl",   joint: "index_proximal_Umdrehung-7", range: [-0.349066, 1.919862], coupled: true }

couplings:
  - { driver: "index_proximal_Umdrehung-7", follower: "index_mid_Umdrehung-8", ratio: 1.0 }

model: model.xml
root_body: "mcp_yoke_index"

tuning: { damping: 0.005, armature: 1.0e-6, kp: 1.0, kv: 0.03 }

ui:
  id: claw_ring
  mech: "tendon finger"
  blurb: "claw ring · 3 dof"
  dofs:
    spread: { id: spread, group: spread, unit: "°", min: -8,  max: 60,  home: 0 }
    flex:   { id: flex,   group: flex,   unit: "°", min: -70, max: 120, home: 0 }
    curl:   { id: curl,   group: curl,   unit: "°", min: -20, max: 110, home: 0 }
