# Claw thumb — the opposing thumb of the 3-finger claw (only fits the thumb slot).
# Chain + joints + limits VERBATIM from the CORRECTED re-export
# (tests/fixtures/sim_assembly_v67.xml, 07.07.2026); home = 0 = stretched rest = 2048 ticks.
# ✅ DIRECTION FIXED AT THE CAD SOURCE: the FLEX joint was re-defined in Fusion so flexion now
# runs POSITIVE ([-5°, +190°]) — same sign convention as index/mid flex ([-70°, +120°]).
# The old sim-side axis flip (sim_sign) is therefore NO LONGER needed and was removed.
name: claw_thumb
label: "Claw thumb"
motors: 3
slot: thumb

dofs:
  - { key: spread, label: "Spread", joint: "palm_Umdrehung-9", range: [-1.221730, 1.134464] }
  - { key: flex,   label: "Flex",   joint: "mcp_yoke_thumb_thumb_mcp_flex", range: [-0.087266, 3.316126] }
  - { key: curl,   label: "Curl",   joint: "thumb_proximal_Umdrehung-17", range: [-0.349066, 1.919862], coupled: true }

couplings:
  - { driver: "thumb_proximal_Umdrehung-17", follower: "thumb_mid_Umdrehung-12", ratio: 1.0 }

model: model.xml
root_body: "mcp_yoke_thumb"

tuning: { damping: 0.005, armature: 1.0e-6, kp: 1.0, kv: 0.03 }

ui:
  id: claw_thumb
  mech: "tendon thumb"
  blurb: "claw thumb · 3 dof"
  dofs:
    spread: { id: spread, group: spread, unit: "°", min: -70, max: 65,  home: 0 }
    flex:   { id: flex,   group: flex,   unit: "°", min: -5,  max: 190, home: 0 }
    curl:   { id: curl,   group: curl,   unit: "°", min: -20, max: 110, home: 0 }
