# The 3-finger claw, MODULAR — palm_mount (minimal hex base) -> palm (adapter, 3 typed
# slots) -> claw_finger (index) + claw_mid (mid) + claw_thumb. index and mid are the same
# printed part, but v67 exported them as independent components with their own local frames,
# so each gets its own verbatim bundle. All geometry + joint limits come from the
# sim_assembly_v67 re-export (all yokes native, mirror-free, directions fixed in Fusion).
# Run headless with:  HANDLAB_BUILD=claw3f ~/.venvs/handlab/bin/python -m handlab
#
# Servo IDs (set the physical Dynamixel IDs to match):
#   index -> 1 (spread) 2 (flex) 3 (curl)   <- 3 motors READY
#   thumb -> 4 (spread) 5 (flex) 6 (curl)   <- 3 motors READY
#   mid   -> 7 (spread) 8 (flex) 9 (curl)   <- add when the last 3 motors arrive
name: claw3f
mount: palm_mount
adapter: palm
# Motion/force feel (08.07): moved from the tame bring-up default to "balanced" — stronger and
# quicker, but < current_limit (keeps compliance). Overtravel is now prevented by the measured
# range_deg limits (calibration.yaml), no longer by weak force. Read ONCE at app start → restart
# the app (not just reconnect) after a change.
hardware:
  model: XL330-M288-T
  ticks_per_rev: 4096
  port: "/dev/cu.usbserial-FILL_ME"   # UI picks the real port on Connect
  baud: 1000000                     # 13.07: 57600 starved the GUI thread (telemetry ~55 ms/tick)
  profile_velocity: 200               # ~46 rev/min (default 60 ≈ 14 rev/min = sluggish)
  profile_acceleration: 50            # snappier start (default 20)
  goal_current: 1300                  # mA MOVE force (900 was not enough for the coupled curl; PWM drove the range at ~1500)
  hold_current: 550                   # mA HOLD force — a settled servo drops to this: no overheating + 9x550 = 4.95 A < 10 A supply
  pos_p: 900                          # 13.07: the FIRMWARE default is 250 (only 11-19% tracking → dead zone on small moves); every opmode write in _configure also RESETS the PID to 250, so the driver writes PID AFTER opmode on every connect. 900 = tight tracking (~0.78 compliance gain)
  pos_i: 0                            # the integral winds up on the constant elastic load → leave it off
  pos_d: 0
  current_limit: 1500                 # mA EEPROM ceiling (≈ stall; register max 1750)

fingers:
  - { id: index, type: claw_finger, socket: index, servos: [1, 2, 3] }
  - { id: thumb, type: claw_thumb,  socket: thumb, servos: [4, 5, 6] }
  - { id: mid,   type: claw_mid,    socket: mid,   servos: [7, 8, 9] }
